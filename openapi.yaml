openapi: 3.0.3
info:
  title: Pera Agent Wallet API
  version: 0.1.0
  description: "Multi-user REST + MCP API for the Pera dashboard and for AI
    agents. Auth: passkey (WebAuthn) → owner session `ps_…` (everything); scoped
    agent tokens `pat_…` (scopes read | pay | fund | admin) for AI runtimes; the
    static API_BEARER_TOKEN is the admin credential. All amounts are decimal
    USDC strings; every mutation returns tx hashes and emits a per-user event."
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RegisterOptionsBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - displayName
      additionalProperties: false
    RegisterBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        challenge:
          type: string
          minLength: 16
        registration:
          type: object
          properties:
            id:
              type: string
              minLength: 8
            rawId:
              type: string
            type:
              type: string
            response:
              type: object
              properties:
                clientDataJSON:
                  type: string
                attestationObject:
                  type: string
                authenticatorData:
                  type: string
                publicKey:
                  type: string
                publicKeyAlgorithm:
                  type: number
                transports:
                  type: array
                  items:
                    type: string
              required:
                - clientDataJSON
              additionalProperties: false
          required:
            - id
            - response
          additionalProperties: false
        dailyCapUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - displayName
        - challenge
        - registration
      additionalProperties: false
    LoginOptionsBody:
      type: object
      properties:
        credentialId:
          type: string
      additionalProperties: false
    LoginVerifyBody:
      type: object
      properties:
        challenge:
          type: string
        assertion:
          type: object
          properties:
            id:
              type: string
            rawId:
              type: string
            type:
              type: string
            response:
              type: object
              properties:
                clientDataJSON:
                  type: string
                authenticatorData:
                  type: string
                signature:
                  type: string
                userHandle:
                  nullable: true
                  type: string
              required:
                - clientDataJSON
                - authenticatorData
                - signature
              additionalProperties: false
          required:
            - id
            - response
          additionalProperties: false
      required:
        - challenge
        - assertion
      additionalProperties: false
    XdrBody:
      type: object
      properties:
        xdr:
          type: string
          minLength: 20
      required:
        - xdr
      additionalProperties: false
    AuthorizeBuildBody:
      type: object
      properties:
        dailyCapUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      additionalProperties: false
    OnrampBody:
      type: object
      properties:
        amountTry:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
      required:
        - amountTry
      additionalProperties: false
    BankTransferBody:
      type: object
      properties:
        iban:
          type: string
          minLength: 10
          maxLength: 40
        reference:
          type: string
          minLength: 4
          maxLength: 40
        amountTry:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
      required:
        - iban
        - reference
        - amountTry
      additionalProperties: false
    OfframpBody:
      type: object
      properties:
        amountUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - amountUsdc
      additionalProperties: false
    AmountBody:
      type: object
      properties:
        amountUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - amountUsdc
      additionalProperties: false
    PolicyBody:
      type: object
      properties:
        dailyCapUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - dailyCapUsdc
      additionalProperties: false
    CapBody:
      type: object
      properties:
        dailyCapUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
        weeklyCapUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      additionalProperties: false
    RulesBody:
      type: object
      properties:
        weeklyCapUsdc:
          nullable: true
          type: string
          pattern: ^\d+(\.\d{1,7})?$
        maxPerCallUsdc:
          nullable: true
          type: string
          pattern: ^\d+(\.\d{1,7})?$
        allowedNetworks:
          minItems: 1
          type: array
          items:
            type: string
            enum:
              - stellar:testnet
              - eip155:84532
        approveAboveUsdc:
          nullable: true
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - weeklyCapUsdc
        - maxPerCallUsdc
        - allowedNetworks
      additionalProperties: false
    RulesApprovalBody:
      type: object
      properties:
        challenge:
          type: string
          minLength: 16
        assertion:
          type: object
          properties:
            id:
              type: string
            rawId:
              type: string
            type:
              type: string
            response:
              type: object
              properties:
                clientDataJSON:
                  type: string
                authenticatorData:
                  type: string
                signature:
                  type: string
                userHandle:
                  nullable: true
                  type: string
              required:
                - clientDataJSON
                - authenticatorData
                - signature
              additionalProperties: false
          required:
            - id
            - response
          additionalProperties: false
      required:
        - challenge
        - assertion
      additionalProperties: false
    PayBody:
      type: object
      properties:
        url:
          type: string
          format: uri
        prefer:
          default: auto
          type: string
          enum:
            - auto
            - stellar
            - evm
      required:
        - url
        - prefer
      additionalProperties: false
    PayBodyV2:
      type: object
      properties:
        url:
          type: string
          format: uri
        method:
          default: GET
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        prefer:
          default: auto
          type: string
          enum:
            - auto
            - stellar
            - evm
        maxAmountUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
        approvalId:
          type: string
      required:
        - url
        - method
        - prefer
      additionalProperties: false
    QuoteBody:
      type: object
      properties:
        url:
          type: string
          format: uri
        method:
          default: GET
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        headers:
          type: object
          additionalProperties:
            type: string
        body:
          type: string
        prefer:
          default: auto
          type: string
          enum:
            - auto
            - stellar
            - evm
      required:
        - url
        - method
        - prefer
      additionalProperties: false
    CreateTokenBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 64
        scopes:
          default:
            - read
            - pay
          minItems: 1
          type: array
          items:
            type: string
            enum:
              - read
              - pay
              - fund
              - admin
        ttlDays:
          nullable: true
          type: integer
          minimum: 0
          exclusiveMinimum: true
          maximum: 365
      required:
        - name
        - scopes
      additionalProperties: false
    EvmTransferBody:
      type: object
      properties:
        to:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        amountUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - to
        - amountUsdc
      additionalProperties: false
    Event:
      type: object
      properties:
        id:
          type: string
        ts:
          type: string
        type:
          type: string
        userId:
          type: string
        amountUsdc:
          type: string
        network:
          type: string
          enum:
            - stellar:testnet
            - eip155:84532
        txHash:
          type: string
        explorerUrl:
          type: string
        detail:
          type: object
          additionalProperties: {}
      required:
        - id
        - ts
        - type
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        errorCode:
          type: number
        detail: {}
      required:
        - error
      additionalProperties: false
paths:
  /status:
    get:
      summary: Network, sponsor, smart-account artefacts, vault, EVM provider,
        facilitator (public)
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/register:
    post:
      summary: Register a passkey-owned smart account (deploy payload from
        smart-account-kit createWallet) and provision treasury/agent/EVM wallets
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: "{ token, expiresAt, user, wallets }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a1
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": *a1
        "409": *a1
  /auth/login/options:
    post:
      summary: WebAuthn assertion options (challenge, rpId, allowCredentials)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginOptionsBody"
      responses:
        "200":
          description: "{ challenge, rpId, allowCredentials }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/login/verify:
    post:
      summary: Verify the passkey assertion → session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginVerifyBody"
      responses:
        "200":
          description: "{ token, expiresAt, user, wallets }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /auth/logout:
    post:
      summary: Invalidate the session
      security: &a2
        - bearerAuth: []
      responses:
        "200":
          description: "{ ok }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /me:
    get:
      summary: User + wallets (smart account, treasury, agent, cap, EVM)
      security: *a2
      responses:
        "200":
          description: Me
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /balances:
    get:
      summary: Treasury, float, smart account, vault position, Base USDC
      security: *a2
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /onramp:
    post:
      summary: SEP-6 TRY deposit into the user's treasury + simulated wire
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnrampBody"
      responses:
        "202":
          description: "{ anchorTxId, status, instructions, destination }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": *a1
  /onramp/{id}:
    get:
      summary: Anchor transaction passthrough
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Anchor transaction
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /offramp:
    post:
      summary: SEP-6 withdraw USDC → TRY (vault → treasury first if needed; sponsor
        pays)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfframpBody"
      responses:
        "200":
          description: "{ anchorTxId, stellarTxHash, status, amountTry }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": *a1
  /yield/deposit:
    post:
      summary: Manual vault deposit (treasury → vault)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountBody"
      responses:
        "200":
          description: "{ amountUsdc, txHash, explorerUrl }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503": *a1
  /yield/withdraw:
    post:
      summary: Manual vault withdraw
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountBody"
      responses:
        "200":
          description: "{ amountUsdc, txHash, explorerUrl }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503": *a1
  /yield/position:
    get:
      summary: Vault position and APY
      security: *a2
      parameters:
        - name: fresh
          in: query
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: "{ vaultId, dfTokens, underlyingUsdc, apy }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/policy:
    get:
      summary: Cap, used, remaining, rule id — read from the spending_limit policy
        contract
      security: *a2
      responses:
        "200":
          description: PolicyView
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Submit the passkey-signed cap change (built by /agent/policy/build)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XdrBody"
      responses:
        "200":
          description: "{ ruleId, txHash, dailyCapUsdc?, weeklyCapUsdc?, rules? }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /onramp/instructions:
    post:
      summary: "The user's deposit details: anchor IBAN + the reference that routes a
        bank transfer to their treasury (a SEP-6 order, reused until paid into)"
      security: *a2
      responses:
        "200":
          description: "{ iban, bankName, reference, anchorTxId, minTry, maxTry }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /bank/transfer:
    post:
      summary: "Sandbox bank rail (public): pay amountTry to an IBAN with a reference
        — plays the bank for the mock anchor (pnpm bank)"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BankTransferBody"
      responses:
        "202":
          description: "{ reference, amountTry, status, anchorTxId }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404": *a1
        "409": *a1
  /agent/rules/options:
    post:
      summary: "Propose a ruleset: returns a single-use WebAuthn challenge bound to
        it, to be signed by the passkey that owns the wallet"
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesBody"
      responses:
        "200":
          description: "{ challenge, rpId, allowCredentials, rules }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /cli/token:
    post:
      summary: Mint a separate session for the CLI (pnpm agent connect <token>); the
        passkey cannot be used from a terminal
      security: *a2
      responses:
        "200":
          description: "{ token, expiresAt, connect }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/rules:
    get:
      summary: Router-enforced agent rules (weekly x402 limit, max price per call,
        allowed chains) + this week's spend
      security: *a2
      responses:
        "200":
          description: "{ weeklyCapUsdc, maxPerCallUsdc, allowedNetworks,
            spentThisWeekUsdc, paymentsThisWeek, enforcedBy }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      summary: "Apply the ruleset approved by the owner's passkey: { challenge,
        assertion } from /agent/rules/options. Violations make POST /agent/pay
        answer 409 RULE_VIOLATION before anything is signed"
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesApprovalBody"
      responses:
        "200":
          description: "{ weeklyCapUsdc, maxPerCallUsdc, allowedNetworks,
            spentThisWeekUsdc, paymentsThisWeek, enforcedBy }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": *a1
  /agent/policy/build:
    post:
      summary: "Build a cap change for passkey signing: daily or weekly window.
        method=set_spending_limit → kit.wallet.fromJSON.execute,
        method=add_policy (weekly window on an older rule) →
        fromJSON.add_policy; then kit.signAdmin"
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CapBody"
      responses:
        "200":
          description: "{ json, xdr, ruleId, window, method, dailyCapUsdc | weeklyCapUsdc }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/authorize/build:
    post:
      summary: Build add_context_rule (agent signer + spending_limit) for passkey
        signing
      security: *a2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeBuildBody"
      responses:
        "200":
          description: "{ json, xdr, agentPublicKey, dailyCapUsdc, ruleName,
            smartAccountId }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/authorize:
    post:
      summary: Submit the passkey-signed rule transaction sponsored; records the rule id
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XdrBody"
      responses:
        "200":
          description: "{ ruleId, txHash, explorerUrl }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /stellar/submit:
    post:
      summary: Sponsored submission of any passkey-signed transaction targeting the
        user's smart account
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XdrBody"
      responses:
        "200":
          description: "{ hash, explorerUrl, ledger }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/pay:
    post:
      summary: "Pay a paywalled URL (x402): rules → approval threshold → on-chain cap
        → settlement; returns the paid body, tx hashes and the event timeline.
        Scope: pay"
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayBodyV2"
      responses:
        "200":
          description: PayResult
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403": *a1
        "409":
          description: RULE_VIOLATION | SPENDING_CAP_EXCEEDED | APPROVAL_REQUIRED
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "502": *a1
  /agent/pay/over-cap-demo:
    post:
      summary: Fund the smart account then attempt a top-up above the cap; returns the
        on-chain rejection
      security: *a2
      responses:
        "200":
          description: OverCapResult
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409": *a1
  /evm/transfer:
    post:
      summary: Gasless USDC transfer from the user's EVM wallet (Privy sponsorship or
        EIP-3009 relay)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvmTransferBody"
      responses:
        "200":
          description: "{ hash, explorerUrl, sponsored }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/quote:
    post:
      summary: "Probe a paywalled URL without paying: offers (price/network/payee) and
        the rules' verdict (allow | requires_approval | denied). Scope: read"
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteBody"
      responses:
        "200":
          description: Quote + verdict
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403": *a1
  /agent/services:
    get:
      summary: "Paywalled endpoints the demo resource server advertises. Scope: read"
      security: *a2
      responses:
        "200":
          description: "{ resourceServer, endpoints[] }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/tokens:
    get:
      summary: List the user's agent tokens (owner session)
      security: *a2
      responses:
        "200":
          description: AgentToken[]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403": *a1
    post:
      summary: Mint a scoped, revocable agent token (pat_…) for an AI runtime; the
        secret is returned once (owner session)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTokenBody"
      responses:
        "201":
          description: "{ id, name, scopes, expiresAt, token }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403": *a1
  /agent/tokens/{id}:
    delete:
      summary: Revoke an agent token (owner session)
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: "{ ok }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404": *a1
  /agent/connect/hermes:
    post:
      summary: Mint a read+pay token and return the Hermes config snippet, env line,
        deep link and Claude Code command (owner session)
      security: *a2
      responses:
        "200":
          description: "{ tokenId, scopes, expiresAt, mcpUrl, snippetYaml, envLine,
            deepLink, claudeCode, stdioShim, skill }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /approvals:
    get:
      summary: Approvals for payments above the owner's threshold
        (?status=pending|approved|denied|expired|consumed)
      security: *a2
      parameters:
        - name: status
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Approval[]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /approvals/{id}:
    get:
      summary: One approval
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "404": *a1
  /approvals/{id}/approve:
    post:
      summary: Owner approves a pending payment (owner session); the agent retries
        with approval_id
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409": *a1
  /approvals/{id}/deny:
    post:
      summary: Owner denies a pending payment (owner session)
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Approval
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409": *a1
  /mcp:
    post:
      summary: "MCP server (Streamable HTTP, stateless, JSON responses). Bearer =
        agent token (pat_…) or passkey session. Tools: wallet_info,
        get_balances, get_spending_policy, list_services, quote_payment,
        pay_url, list_payments, request_funding — filtered by the token's
        scopes"
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: JSON-RPC 2.0 request (initialize, tools/list, tools/call)
      responses:
        "200":
          description: JSON-RPC 2.0 response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
        "403": *a1
  /events:
    get:
      summary: User's last 200 events, newest first
      security: *a2
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
