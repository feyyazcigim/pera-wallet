openapi: 3.0.3
info:
  title: Pera Agent Wallet API
  version: 0.1.0
  description: "Multi-user REST API for the Pera dashboard. Auth: passkey
    (WebAuthn) → session bearer `ps_…`; the static API_BEARER_TOKEN is the admin
    credential. All amounts are decimal USDC strings; every mutation returns tx
    hashes and emits a per-user event."
servers:
  - url: http://localhost:3000
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    RegisterOptionsBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
      required:
        - displayName
      additionalProperties: false
    RegisterBody:
      type: object
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 64
        email:
          type: string
          format: email
          pattern: ^(?:[A-Za-z0-9_'+\-]+\.)*[A-Za-z0-9_'+\-]*[A-Za-z0-9_+-]@(?:[A-Za-z0-9][A-Za-z0-9\-]*\.)+[A-Za-z]{2,}$
        challenge:
          type: string
          minLength: 16
        registration:
          type: object
          properties:
            id:
              type: string
              minLength: 8
            rawId:
              type: string
            type:
              type: string
            response:
              type: object
              properties:
                clientDataJSON:
                  type: string
                attestationObject:
                  type: string
                authenticatorData:
                  type: string
                publicKey:
                  type: string
                publicKeyAlgorithm:
                  type: number
                transports:
                  type: array
                  items:
                    type: string
              required:
                - clientDataJSON
              additionalProperties: false
          required:
            - id
            - response
          additionalProperties: false
        dailyCapUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - displayName
        - challenge
        - registration
      additionalProperties: false
    LoginOptionsBody:
      type: object
      properties:
        credentialId:
          type: string
      additionalProperties: false
    LoginVerifyBody:
      type: object
      properties:
        challenge:
          type: string
        assertion:
          type: object
          properties:
            id:
              type: string
            rawId:
              type: string
            type:
              type: string
            response:
              type: object
              properties:
                clientDataJSON:
                  type: string
                authenticatorData:
                  type: string
                signature:
                  type: string
                userHandle:
                  nullable: true
                  type: string
              required:
                - clientDataJSON
                - authenticatorData
                - signature
              additionalProperties: false
          required:
            - id
            - response
          additionalProperties: false
      required:
        - challenge
        - assertion
      additionalProperties: false
    XdrBody:
      type: object
      properties:
        xdr:
          type: string
          minLength: 20
      required:
        - xdr
      additionalProperties: false
    AuthorizeBuildBody:
      type: object
      properties:
        dailyCapUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      additionalProperties: false
    OnrampBody:
      type: object
      properties:
        amountTry:
          type: string
          pattern: ^\d+(\.\d{1,2})?$
      required:
        - amountTry
      additionalProperties: false
    OfframpBody:
      type: object
      properties:
        amountUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - amountUsdc
      additionalProperties: false
    AmountBody:
      type: object
      properties:
        amountUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - amountUsdc
      additionalProperties: false
    PolicyBody:
      type: object
      properties:
        dailyCapUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - dailyCapUsdc
      additionalProperties: false
    RulesBody:
      type: object
      properties:
        weeklyCapUsdc:
          nullable: true
          type: string
          pattern: ^\d+(\.\d{1,7})?$
        maxPerCallUsdc:
          nullable: true
          type: string
          pattern: ^\d+(\.\d{1,7})?$
        allowedNetworks:
          minItems: 1
          type: array
          items:
            type: string
            enum:
              - stellar:testnet
              - eip155:84532
      required:
        - weeklyCapUsdc
        - maxPerCallUsdc
        - allowedNetworks
      additionalProperties: false
    PayBody:
      type: object
      properties:
        url:
          type: string
          format: uri
        prefer:
          default: auto
          type: string
          enum:
            - auto
            - stellar
            - evm
      required:
        - url
        - prefer
      additionalProperties: false
    EvmTransferBody:
      type: object
      properties:
        to:
          type: string
          pattern: ^0x[0-9a-fA-F]{40}$
        amountUsdc:
          type: string
          pattern: ^\d+(\.\d{1,7})?$
      required:
        - to
        - amountUsdc
      additionalProperties: false
    Event:
      type: object
      properties:
        id:
          type: string
        ts:
          type: string
        type:
          type: string
        userId:
          type: string
        amountUsdc:
          type: string
        network:
          type: string
          enum:
            - stellar:testnet
            - eip155:84532
        txHash:
          type: string
        explorerUrl:
          type: string
        detail:
          type: object
          additionalProperties: {}
      required:
        - id
        - ts
        - type
      additionalProperties: false
    Error:
      type: object
      properties:
        error:
          type: string
        code:
          type: string
        errorCode:
          type: number
        detail: {}
      required:
        - error
      additionalProperties: false
paths:
  /status:
    get:
      summary: Network, sponsor, smart-account artefacts, vault, EVM provider,
        facilitator (public)
      security: []
      responses:
        "200":
          description: Status
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/register:
    post:
      summary: Register a passkey-owned smart account (deploy payload from
        smart-account-kit createWallet) and provision treasury/agent/EVM wallets
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterBody"
      responses:
        "201":
          description: "{ token, expiresAt, user, wallets }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": &a1
          description: Error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403": *a1
        "409": *a1
  /auth/login/options:
    post:
      summary: WebAuthn assertion options (challenge, rpId, allowCredentials)
      security: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginOptionsBody"
      responses:
        "200":
          description: "{ challenge, rpId, allowCredentials }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /auth/login/verify:
    post:
      summary: Verify the passkey assertion → session token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginVerifyBody"
      responses:
        "200":
          description: "{ token, expiresAt, user, wallets }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /auth/logout:
    post:
      summary: Invalidate the session
      security: &a2
        - bearerAuth: []
      responses:
        "200":
          description: "{ ok }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /me:
    get:
      summary: User + wallets (smart account, treasury, agent, cap, EVM)
      security: *a2
      responses:
        "200":
          description: Me
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /balances:
    get:
      summary: Treasury, float, smart account, vault position, Base USDC
      security: *a2
      responses:
        "200":
          description: Balances
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "401": *a1
  /onramp:
    post:
      summary: SEP-6 TRY deposit into the user's treasury + simulated wire
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OnrampBody"
      responses:
        "202":
          description: "{ anchorTxId, status, instructions, destination }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": *a1
  /onramp/{id}:
    get:
      summary: Anchor transaction passthrough
      security: *a2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Anchor transaction
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /offramp:
    post:
      summary: SEP-6 withdraw USDC → TRY (vault → treasury first if needed; sponsor
        pays)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OfframpBody"
      responses:
        "200":
          description: "{ anchorTxId, stellarTxHash, status, amountTry }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": *a1
  /yield/deposit:
    post:
      summary: Manual vault deposit (treasury → vault)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountBody"
      responses:
        "200":
          description: "{ amountUsdc, txHash, explorerUrl }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503": *a1
  /yield/withdraw:
    post:
      summary: Manual vault withdraw
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AmountBody"
      responses:
        "200":
          description: "{ amountUsdc, txHash, explorerUrl }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503": *a1
  /yield/position:
    get:
      summary: Vault position and APY
      security: *a2
      parameters:
        - name: fresh
          in: query
          schema:
            type: string
            enum:
              - "1"
      responses:
        "200":
          description: "{ vaultId, dfTokens, underlyingUsdc, apy }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/policy:
    get:
      summary: Cap, used, remaining, rule id — read from the spending_limit policy
        contract
      security: *a2
      responses:
        "200":
          description: PolicyView
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    post:
      summary: Submit the passkey-signed cap change (built by /agent/policy/build)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XdrBody"
      responses:
        "200":
          description: "{ ruleId, txHash, dailyCapUsdc }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/rules:
    get:
      summary: Router-enforced agent rules (weekly x402 limit, max price per call,
        allowed chains) + this week's spend
      security: *a2
      responses:
        "200":
          description: "{ weeklyCapUsdc, maxPerCallUsdc, allowedNetworks,
            spentThisWeekUsdc, paymentsThisWeek, enforcedBy }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
    put:
      summary: Replace the agent rules; violations make POST /agent/pay answer 409
        RULE_VIOLATION before anything is signed
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RulesBody"
      responses:
        "200":
          description: "{ weeklyCapUsdc, maxPerCallUsdc, allowedNetworks,
            spentThisWeekUsdc, paymentsThisWeek, enforcedBy }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "400": *a1
  /agent/policy/build:
    post:
      summary: Build set_spending_limit for passkey signing
        (kit.wallet.fromJSON.execute → kit.signAdmin)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyBody"
      responses:
        "200":
          description: "{ json, xdr, ruleId, dailyCapUsdc }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/authorize/build:
    post:
      summary: Build add_context_rule (agent signer + spending_limit) for passkey
        signing
      security: *a2
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthorizeBuildBody"
      responses:
        "200":
          description: "{ json, xdr, agentPublicKey, dailyCapUsdc, ruleName,
            smartAccountId }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/authorize:
    post:
      summary: Submit the passkey-signed rule transaction sponsored; records the rule id
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XdrBody"
      responses:
        "200":
          description: "{ ruleId, txHash, explorerUrl }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /stellar/submit:
    post:
      summary: Sponsored submission of any passkey-signed transaction targeting the
        user's smart account
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/XdrBody"
      responses:
        "200":
          description: "{ hash, explorerUrl, ledger }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /agent/pay:
    post:
      summary: Run the x402 router for a URL; returns the paid body, tx hashes and the
        event timeline
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PayBody"
      responses:
        "200":
          description: PayResult
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409": *a1
        "502": *a1
  /agent/pay/over-cap-demo:
    post:
      summary: Fund the smart account then attempt a top-up above the cap; returns the
        on-chain rejection
      security: *a2
      responses:
        "200":
          description: OverCapResult
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409": *a1
  /evm/transfer:
    post:
      summary: Gasless USDC transfer from the user's EVM wallet (Privy sponsorship or
        EIP-3009 relay)
      security: *a2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EvmTransferBody"
      responses:
        "200":
          description: "{ hash, explorerUrl, sponsored }"
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /events:
    get:
      summary: User's last 200 events, newest first
      security: *a2
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Event"
  /events/stream:
    get:
      summary: Server-Sent Events feed for the user (?token= accepted)
      security: *a2
      parameters:
        - name: token
          in: query
          schema:
            type: string
      responses:
        "200":
          description: text/event-stream
  /admin/events:
    get:
      summary: All users' events (admin bearer)
      security: *a2
      responses:
        "200":
          description: Event[]
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "403": *a1
