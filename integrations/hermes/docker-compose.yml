# Hermes Agent as a Telegram bot wired to Pera's MCP server — Dokploy "Compose" service.
#   Compose Path: ./integrations/hermes/docker-compose.yml (GitHub provider, branch main)
#   Environment tab: AWS_BEARER_TOKEN_BEDROCK (or AWS_ACCESS_KEY_ID + AWS_SECRET_ACCESS_KEY), AWS_REGION, HERMES_MODEL,
#                    TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS, PERA_AGENT_TOKEN, PERA_MCP_URL. No domain/port: Telegram long-polls.
# Uses the official image (docker.io/nousresearch/hermes-agent, ~1 GB pull) — nothing is built on the server.
# Config-as-code: /opt/data/config.yaml is rewritten from the environment on EVERY boot (no seeding, nothing to edit by
# hand in the volume). Change the env in Dokploy or the block below and redeploy.
services:
  hermes:
    image: nousresearch/hermes-agent:v2026.9.14   # pin; bump deliberately (`:latest` tracks main)
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        mkdir -p /opt/data/skills/payments
        # Model route. Default "bedrock-openai": Bedrock's OpenAI-compatible endpoint (needs AWS_BEARER_TOKEN_BEDROCK) —
        # Hermes' most mature tool-calling path; the native Converse route ("bedrock", IAM keys OK) broke on Kimi with
        # "toolResult blocks exceed toolUse blocks". HERMES_PROVIDER=bedrock switches back.
        if [ "$${HERMES_PROVIDER:-bedrock-openai}" = "bedrock" ]; then
          MODEL_BLOCK="model:
          provider: \"bedrock\"
          default: \"$${HERMES_MODEL}\""
        else
          MODEL_BLOCK="model:
          provider: \"custom\"
          default: \"$${HERMES_MODEL}\"
          base_url: \"$${HERMES_BASE_URL:-https://bedrock-runtime.$${AWS_REGION}.amazonaws.com/openai/v1}\"
          api_key: \"$${AWS_BEARER_TOKEN_BEDROCK}\""
        fi
        cat > /opt/data/config.yaml <<EOF
        $${MODEL_BLOCK}
        platforms:
          telegram:
            enabled: true
        mcp_servers:
          pera_wallet:
            url: "$${PERA_MCP_URL}"
            headers:
              Authorization: "Bearer $${PERA_AGENT_TOKEN}"
            timeout: 300                # tool-call timeout: a Base payment bridges via CCTP first (burn → attestation → mint, 1–3 min)
            connect_timeout: 30
            tools:
              include: [wallet_info, get_balances, get_spending_policy, list_services, quote_payment, pay_url, list_payments, request_funding]
              resources: false
              prompts: false
        EOF
        if [ -d /opt/seed/skills/payments/pera-wallet ]; then
          rm -rf /opt/data/skills/payments/pera-wallet
          cp -r /opt/seed/skills/payments/pera-wallet /opt/data/skills/payments/
        fi
        chown -R "$${HERMES_UID:-10000}:$${HERMES_GID:-10000}" /opt/data/config.yaml /opt/data/skills 2>/dev/null || true
        echo "[pera] config.yaml written: route=$${HERMES_PROVIDER:-bedrock-openai} model=$${HERMES_MODEL} region=$${AWS_REGION} mcp=$${PERA_MCP_URL} token=$${PERA_AGENT_TOKEN%%_*}_…"
        exec /opt/hermes/docker/entrypoint-dispatch.sh gateway run
    environment:
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      HERMES_MODEL: ${HERMES_MODEL:-moonshotai.kimi-k2.5}
      HERMES_PROVIDER: ${HERMES_PROVIDER:-bedrock-openai}   # bedrock-openai (Bedrock API key) | bedrock (native Converse, IAM keys)
      HERMES_BASE_URL: ${HERMES_BASE_URL:-}                   # override the OpenAI-compatible URL (default derives from AWS_REGION)
      # AWS Bedrock (the image ships boto3): either a Bedrock API key or IAM keys; region must have model access enabled.
      AWS_BEARER_TOKEN_BEDROCK: ${AWS_BEARER_TOKEN_BEDROCK:-}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
      AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
      AWS_REGION: ${AWS_REGION:-us-east-2}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_ALLOWED_USERS: ${TELEGRAM_ALLOWED_USERS}
      PERA_AGENT_TOKEN: ${PERA_AGENT_TOKEN}
      PERA_MCP_URL: ${PERA_MCP_URL:-https://api.perastellar.xyz/mcp}
      TERMINAL_ENV: local
    volumes:
      - hermes-data:/opt/data
      - ./skills:/opt/seed/skills:ro

volumes:
  hermes-data:
