# ~/.hermes/config.yaml — Pera Agent Wallet as a remote MCP server.
# Token: PERA_AGENT_TOKEN in ~/.hermes/.env (read + pay scopes; mint it in the Pera dashboard → Connect an agent).
mcp_servers:
  pera_wallet:
    url: "https://<api-host>/mcp"
    headers:
      Authorization: "Bearer ${env:PERA_AGENT_TOKEN}"
    trust: untrusted            # ask before non-read tools (pay_url); read tools are free
    timeout: 120                # pay_url may bridge via CCTP (> 60 s)
    keepalive_interval: 60
    protocol: auto              # stateless Streamable HTTP
    tools:
      include: [wallet_info, get_balances, get_spending_policy, list_services, quote_payment, pay_url, list_payments, request_funding]
      resources: false
      prompts: false
