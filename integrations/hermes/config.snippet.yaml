# ~/.hermes/config.yaml — Pera Agent Wallet as a remote MCP server.
# Token: PERA_AGENT_TOKEN in ~/.hermes/.env (read + pay scopes; mint it in the Pera dashboard → Connect an agent).
mcp_servers:
  pera_wallet:
    url: "https://<api-host>/mcp"
    headers:
      Authorization: "Bearer ${PERA_AGENT_TOKEN}"
    timeout: 300                # tool-call timeout: a Base payment bridges via CCTP first (burn → attestation → mint, 1–3 min)
    connect_timeout: 30
    tools:
      include: [wallet_info, get_balances, get_spending_policy, list_services, quote_payment, pay_url, list_payments, payment_status, request_funding]
      resources: false
      prompts: false
