# Dokploy Application "dashboard": Build Type Nixpacks, Build Path "/",
# env NIXPACKS_CONFIG_FILE=nixpacks.dashboard.toml + VITE_API_URL=https://api.<domain>,
# Publish Directory "apps/dashboard/dist", "Single Page Application (SPA)" enabled.
providers = ["node"]

[variables]
NIXPACKS_NODE_VERSION = "22"
NPM_CONFIG_PRODUCTION = "false"

[phases.install]
cmds = ["corepack enable", "corepack prepare pnpm@10.28.2 --activate", "pnpm install --frozen-lockfile"]

[phases.build]
cmds = ["pnpm --filter @pera/dashboard build"]

# Not used: Dokploy serves the publish directory with nginx after the build.
[start]
cmd = "pnpm --filter @pera/dashboard preview --host"
